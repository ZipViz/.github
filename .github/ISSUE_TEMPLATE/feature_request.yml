name: Feature request
description: Suggest a change or an addition to a ZipViz tool or the API description.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The change you have in mind. Examples of commands or requests help.
    validations:
      required: true
