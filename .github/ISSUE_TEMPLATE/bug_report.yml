name: Bug report
description: Something in a ZipViz tool or the registry API does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include private keys, invite codes or other secrets.
        For a security issue, report it privately at https://zipviz.ai/security instead of opening an issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands, tool calls or requests, in order. Error codes (such as `E_SIG_MISMATCH`) help.
      placeholder: |
        1. npx zipviz-mcp ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The package version (for example `npx zipviz --version`), or the commit you built from.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, and the MCP client if relevant.
